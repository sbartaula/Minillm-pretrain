[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenslam"
version = "0.1.0"
description = "Tenslam MiniLM: a from-scratch ~30M decoder-only LM trained on TinyStories"
requires-python = ">=3.10"

[project.scripts]
tenslam = "tenslam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
