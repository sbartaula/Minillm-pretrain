# Stage 2 multi-source corpus (~1B training tokens). Run ON THE POD: `tenslam prepare-mix --config configs/data_mix.toml`
# Every dataset is pinned to a commit. Re-read each dataset card's licence before publishing weights.
seed = 1337
chars_per_token_estimate = 4.0   # only used to size the download; the real token counts go in the manifest

[mix]
out_dir = "data/mix"
train_bin = "data/mix/train.bin"
validation_bin = "data/mix/validation.bin"
manifest = "data/mix/prepare_manifest.json"
validation_permille = 20          # ~2% of PARENT documents go to validation (split before chunking)

[mix.preprocess]
min_chars = 200
max_chars = 6000
unicode_form = "NFC"

[mix.tokenizer]
path = "artifacts/tokenizer_mix/tokenizer.json"
vocab_size = 16384
min_frequency = 2
special_tokens = ["<|pad|>", "<|bos|>", "<|endoftext|>"]
sample_docs_per_source = 60000

[[source]]
name = "tinystories"
dataset = "roneneldan/TinyStories"
revision = "f54c09fd23315a6f9c86f9dc80f725de7d8f9c64"
text_field = "text"
license = "cdla-sharing-1.0"
min_chars = 50
train_tokens = 120_000_000
validation_tokens = 1_000_000

[[source]]
name = "fineweb_edu"
dataset = "HuggingFaceFW/fineweb-edu"
config = "sample-10BT"
revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
license = "odc-by"
chunk_chars = 4000
train_tokens = 400_000_000
validation_tokens = 2_000_000

[[source]]
name = "wikipedia"
dataset = "wikimedia/wikipedia"
config = "20231101.en"
revision = "b04c8d1ceb2f5cd4588862100d08de323dccfbaa"
license = "cc-by-sa-3.0 / gfdl"
chunk_chars = 4000
train_tokens = 150_000_000
validation_tokens = 1_000_000

[[source]]
name = "gutenberg"
dataset = "sedthh/gutenberg_english"
revision = "28973b04f28fd7be4a6186a042bc26159d4366ca"
text_field = "TEXT"
license = "mit (dataset); texts are public domain in the US - verify"
chunk_chars = 4000
shuffle_buffer = 20          # books are ~400 KB each; keep RAM small
train_tokens = 150_000_000
validation_tokens = 1_000_000

[[source]]
name = "cosmopedia_stanford"
dataset = "HuggingFaceTB/cosmopedia"
config = "stanford"
revision = "0ae6ec63f91742bd2d1eaef4f02232c55d719385"
