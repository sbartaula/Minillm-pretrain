# Stage 2 (60M, multi-source). Re-benchmark this model on the pod and set micro_batch/max_hours from the result.
# RunPod single-GPU profile. Benchmark first and set batch size / time cap from measurements.
# Do not start this training run until benchmark results and the price estimate are reviewed.
[run]
name = "tenslam_60m_mix"
out_dir = "runs/tenslam_60m_mix"
seed = 1337

[paths]
model_config = "configs/model_60m.toml"
tokenizer = "artifacts/tokenizer_mix/tokenizer.json"
train_bin = "data/mix/train.bin"
val_bin = "data/mix/validation.bin"
manifest = "data/mix/prepare_manifest.json"

[train]
seq_len = 512
micro_batch_size = 32
grad_accum_steps = 4
max_tokens = 1000000000
# Safety default: 30-minute maximum. After benchmarking, lower this if needed so
# (max_hours + setup/checkpoint reserve) * RunPod EUR/hour remains below the €8 budget.
max_hours = 5.5
lr = 6e-4
min_lr = 6e-5
warmup_steps = 500
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
precision = "auto"
device = "auto"
compile = false
eval_interval = 500
eval_batches = 50
log_interval = 10
ckpt_interval = 500
sample_interval = 1000

[generation]
prompts = [
  "Once upon a time, there was a little girl named",
  "The theory of relativity states that",
  "According to the philosopher, the meaning of life",
  "Photosynthesis is the process by which",
]
max_new_tokens = 120
temperature = 0.8
top_k = 40

[cost]
# Leave blank: provide RunPod's actual listed GPU price to `tenslam benchmark --price`.
# The price must be expressed in EUR per hour. This does not include persistent storage,
# data transfer, or provider-specific fees.
# hourly_price_eur = 0.0
setup_minutes = 15
