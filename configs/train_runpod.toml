# RunPod single-GPU profile. Benchmark first and set batch size / time cap from measurements.
# Do not start this training run until benchmark results and the price estimate are reviewed.
[run]
name = "tenslam_30m_runpod"
out_dir = "runs/tenslam_30m_runpod"
seed = 1337

[paths]
model_config = "configs/model.toml"
tokenizer = "artifacts/tokenizer/tokenizer.json"
train_bin = "data/tokens_runpod/train.bin"
val_bin = "data/tokens_runpod/validation.bin"
manifest = "data/tokens_runpod/prepare_manifest.json"

[train]
seq_len = 512
micro_batch_size = 32
grad_accum_steps = 4
max_tokens = 100000000
# Safety default: 30-minute maximum. After benchmarking, lower this if needed so
# (max_hours + setup/checkpoint reserve) * RunPod EUR/hour remains below the €8 budget.
max_hours = 0.5
lr = 1e-3
min_lr = 1e-4
warmup_steps = 150
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
precision = "auto"
device = "auto"
compile = false
eval_interval = 250
eval_batches = 50
log_interval = 10
ckpt_interval = 250
sample_interval = 500

[generation]
prompts = [
  "Once upon a time, there was a little girl named",
  "Tom and his dog went to the park. Suddenly",
  "The robot was sad because",
]
max_new_tokens = 120
temperature = 0.8
top_k = 40

[cost]
# Leave blank: provide RunPod's actual listed GPU price to `tenslam benchmark --price`.
# The price must be expressed in EUR per hour. This does not include persistent storage,
# data transfer, or provider-specific fees.
# hourly_price_eur = 0.0
setup_minutes = 15
